name: fasocine_mobile
description: Application mobile Faso Ciné - streaming de cinéma burkinabè
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état
  provider: ^6.1.2

  # Réseau / API Django
  dio: ^5.4.3

  # Navigation
  go_router: ^14.2.0

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Lecture vidéo (streaming Cloudinary / Vimeo OTT)
  video_player: ^2.9.1
  chewie: ^1.8.1

  # Images (affiches, miniatures) avec cache
  cached_network_image: ^3.3.1

  # Formatage dates, montants FCFA
  intl: ^0.19.0

  # Icônes
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
